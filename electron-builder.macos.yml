appId: com.yodhinsolutions.clipguard
productName: ClipGuard
directories:
  buildResources: build
  output: dist
files:
  - dist/**/*
  - public/**/*
  - assets/**/*
  - macos/**/*
  - package.json
  - node_modules/**/*

mac:
  category: public.app-category.utilities
  target:
    - dmg
    - zip
  arch:
    - arm64
    - x64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  minimumSystemVersion: "10.13.6"
  notarize:
    teamId: ${APPLETEAMID}
  signingIdentity: ${CSC_NAME}
  certificateFile: ${CSC_LINK}
  certificatePassword: ${CSC_KEY_PASSWORD}

dmg:
  sign: false
  icon: null
  contents:
    - x: 130
      y: 220
      type: file
      path: null
    - x: 438
      y: 220
      type: link
      path: /Applications
  window:
    x: 200
    y: 200
    width: 600
    height: 450

zip:
  sign: false

nsis: null

afterSign: build/notarize.js
