<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#0f172a"/>
  <g transform="translate(256, 256)">
    <!-- Lock body -->
    <rect x="-120" y="-80" width="240" height="220" rx="20" fill="url(#grad)" stroke="white" stroke-width="8"/>
    <!-- Lock shackle -->
    <path d="M -80 -80 Q -80 -180 0 -180 Q 80 -180 80 -80" stroke="white" stroke-width="16" fill="none" stroke-linecap="round"/>
    <!-- Keyhole circle -->
    <circle cx="0" cy="20" r="28" fill="white"/>
    <!-- Keyhole dot -->
    <circle cx="0" cy="20" r="16" fill="url(#grad)"/>
    <!-- Checkmark -->
    <path d="M -40 60 L -10 90 L 60 20" stroke="white" stroke-width="20" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
