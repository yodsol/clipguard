<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ClipGuard Menu</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      padding: 30px;
      width: 100%;
      max-width: 320px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    h1 {
      font-size: 24px;
      margin-bottom: 10px;
      text-align: center;
    }
    .subtitle {
      text-align: center;
      color: #666;
      font-size: 12px;
      margin-bottom: 25px;
    }
    .section {
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid #eee;
    }
    .section:last-of-type {
      border-bottom: none;
    }
    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }
    .toggle-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
    }
    .toggle-label {
      font-size: 13px;
      color: #333;
    }
    input[type="checkbox"] {
      width: 40px;
      height: 24px;
      cursor: pointer;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      border: none;
      background: #667eea;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.2s;
    }
    button:hover {
      background: #5568d3;
    }
    button.secondary {
      background: #f5f5f5;
      color: #333;
      border: 1px solid #ddd;
    }
    button.secondary:hover {
      background: #eeeeee;
    }
    .status {
      text-align: center;
      padding: 12px;
      background: #f0f0f0;
      border-radius: 6px;
      font-size: 12px;
      color: #666;
      margin-bottom: 15px;
    }
    .status.active {
      background: #e8f5e9;
      color: #2e7d32;
    }
    .message {
      text-align: center;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }
    .message.success {
      background: #c8e6c9;
      color: #2e7d32;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛡️ ClipGuard</h1>
    <p class="subtitle">Protect your clipboard</p>

    <div id="message" class="message"></div>

    <div class="status active">✓ Monitoring Active</div>

    <div class="section">
      <div class="section-title">Tests</div>
      <button onclick="testMockData()">🧪 Copy Mock GitHub Token</button>
      <button onclick="viewHistory()">📊 View History</button>
    </div>

    <div class="section">
      <div class="section-title">Settings</div>
      <div class="toggle-item">
        <label class="toggle-label">Auto-Clear Data</label>
        <input type="checkbox" id="autoClear">
      </div>
      <div class="toggle-item">
        <label class="toggle-label">Show Warnings</label>
        <input type="checkbox" id="showWarnings" checked>
      </div>
    </div>

    <div class="section">
      <button class="secondary" onclick="quitApp()">❌ Quit ClipGuard</button>
    </div>
  </div>

  <script>
    // Simple function to show message
    function showMessage(text) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.classList.add('success');
      setTimeout(() => {
        msg.classList.remove('success');
      }, 3000);
    }

    // Test with mock data
    function testMockData() {
      const mockToken = 'ghp_REDACTED_FOR_TEST_00000000000000000000';

      // Copy to clipboard using browser API
      navigator.clipboard.writeText(mockToken).then(() => {
        showMessage('✓ Mock token copied! Check for warning...');
      }).catch(err => {
        console.error('Copy failed:', err);
        alert('Mock token: ' + mockToken + '\n\nCould not auto-copy. Please copy manually and paste.');
      });
    }

    function viewHistory() {
      alert('📊 Detection History\n\nNo detections yet. Copy sensitive data to test the detection system.');
    }

    function quitApp() {
      if (confirm('❌ Quit ClipGuard?')) {
        // Close the window
        window.close();
      }
    }
  </script>
</body>
</html>
