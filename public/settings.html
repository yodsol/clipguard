<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClipGuard Settings</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 30px;
    }

    header {
      margin-bottom: 30px;
      border-bottom: 2px solid #f0f0f0;
      padding-bottom: 20px;
    }

    h1 {
      font-size: 24px;
      color: #333;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #999;
      font-size: 13px;
    }

    .settings-group {
      margin-bottom: 30px;
    }

    .setting-title {
      font-weight: 600;
      color: #333;
      margin-bottom: 16px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #666;
    }

    .setting-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      background: #f9f9f9;
      border-radius: 8px;
      margin-bottom: 12px;
      border: 1px solid #e0e0e0;
    }

    .setting-info {
      flex: 1;
    }

    .setting-name {
      font-weight: 500;
      color: #333;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .setting-description {
      font-size: 12px;
      color: #999;
    }

    .toggle {
      position: relative;
      display: inline-flex;
      width: 44px;
      height: 24px;
      background: #ccc;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.3s;
      border: none;
      padding: 0;
      flex-shrink: 0;
    }

    .toggle.active {
      background: #4caf50;
    }

    .toggle::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 10px;
      top: 2px;
      left: 2px;
      transition: transform 0.3s;
    }

    .toggle.active::after {
      transform: translateX(20px);
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: #333;
      margin-top: 30px;
      margin-bottom: 16px;
      padding-top: 20px;
      border-top: 1px solid #e0e0e0;
    }

    .history-list {
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 10px;
    }

    .history-item {
      padding: 8px;
      font-size: 12px;
      border-bottom: 1px solid #f0f0f0;
      color: #666;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .severity-critical {
      color: #d32f2f;
      font-weight: 600;
    }

    .severity-high {
      color: #f57c00;
      font-weight: 600;
    }

    .severity-medium {
      color: #fbc02d;
      font-weight: 600;
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #e0e0e0;
    }

    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 14px;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover {
      background: #5568d3;
    }

    .btn-secondary {
      background: #f5f5f5;
      color: #333;
      border: 1px solid #ddd;
    }

    .btn-secondary:hover {
      background: #eeeeee;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>⚙️ Settings</h1>
      <p class="subtitle">Configure ClipGuard protection</p>
    </header>

    <div id="settings-content" class="loading">Loading settings...</div>
  </div>

  <script>
    const app = window.clipguard;

    async function loadSettings() {
      try {
        const settings = await app.settings.get();
        const history = await app.monitoring.getHistory();
        renderSettings(settings, history);
      } catch (error) {
        console.error('Error loading settings:', error);
        document.getElementById('settings-content').innerHTML = '<p style="color: #f44336;">Error loading settings</p>';
      }
    }

    function renderSettings(settings, history) {
      const content = document.getElementById('settings-content');

      content.innerHTML = `
        <div class="settings-group">
          <div class="setting-title">Protection</div>

          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-name">Enable Monitoring</div>
              <div class="setting-description">Monitor clipboard for sensitive data</div>
            </div>
            <button class="toggle ${settings.monitoring_enabled ? 'active' : ''}" id="monitoringToggle"></button>
          </div>

          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-name">Show Warnings</div>
              <div class="setting-description">Display alerts when sensitive data is detected</div>
            </div>
            <button class="toggle ${settings.show_warnings ? 'active' : ''}" id="warningsToggle"></button>
          </div>

          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-name">Auto-Clear Sensitive Data</div>
              <div class="setting-description">Automatically clear clipboard after copying sensitive content</div>
            </div>
            <button class="toggle ${settings.auto_clear_clipboard ? 'active' : ''}" id="autoClearToggle"></button>
          </div>
        </div>

        <div class="section-title">Detection History</div>
        <div class="history-list" id="historyList">
          ${history.length === 0
            ? '<div class="history-item">No detections yet</div>'
            : history.slice().reverse().slice(0, 10).map(item => `
                <div class="history-item">
                  <span class="severity-${item.severity}">${item.severity.toUpperCase()}</span> -
                  ${item.types.join(', ')} (${new Date(item.timestamp).toLocaleString()})
                </div>
              `).join('')
          }
        </div>

        <div class="button-group">
          <button class="btn-secondary" id="clearHistoryBtn">Clear History</button>
          <button class="btn-primary" id="closeBtn">Close</button>
        </div>
      `;

      // Add event listeners
      document.getElementById('monitoringToggle')?.addEventListener('click', () => toggleSetting('monitoring_enabled'));
      document.getElementById('warningsToggle')?.addEventListener('click', () => toggleSetting('show_warnings'));
      document.getElementById('autoClearToggle')?.addEventListener('click', () => toggleSetting('auto_clear_clipboard'));
      document.getElementById('clearHistoryBtn')?.addEventListener('click', clearHistory);
      document.getElementById('closeBtn')?.addEventListener('click', () => window.close());
    }

    async function toggleSetting(settingKey) {
      try {
        const settings = await app.settings.get();
        settings[settingKey] = !settings[settingKey];
        await app.settings.update(settings);
        loadSettings(); // Reload to reflect changes
      } catch (error) {
        console.error('Error updating setting:', error);
      }
    }

    async function clearHistory() {
      try {
        await app.monitoring.clearHistory();
        loadSettings(); // Reload to show empty history
      } catch (error) {
        console.error('Error clearing history:', error);
      }
    }

    // Load settings on page load
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadSettings);
    } else {
      loadSettings();
    }
  </script>
</body>
</html>
